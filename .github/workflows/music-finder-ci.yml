name: Music Finder - Full CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-finder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test + Build + Lint APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify Gradle
        run: gradle --version

      - name: Unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Assemble debug APK (CI artifact only)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify debug APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: music-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android lint
        run: gradle --no-daemon --stacktrace lint

      - name: Check release signing secrets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release publishing skipped: configure the four Android signing secrets. Debug APKs are not published as in-app updates."
          fi

      - name: Prepare stable release signing key
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          test -s "$RUNNER_TEMP/android-signing/release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Prepare in-app update metadata
        if: success() && steps.signing.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "versionCode": ${{ github.run_number }},
            "versionName": "1.3.${{ github.run_number }}",
            "apk": "music-finder.apk"
          }
          EOF
          cat update.json

      - name: Publish latest signed Full CI
        if: success() && steps.signing.outputs.available == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view ci-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create ci-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Music Finder - Latest Full CI" \
              --notes "Latest successful signed Full CI commit: ${GITHUB_SHA}" \
              --latest=false
          else
            gh release edit ci-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Music Finder - Latest Full CI" \
              --notes "Latest successful signed Full CI commit: ${GITHUB_SHA}"
          fi

          gh release upload ci-latest \
            "app/build/outputs/apk/release/app-release.apk#music-finder.apk" \
            "update.json#update.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
