name: Music Finder - Full CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-finder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test + Build + Lint APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply search fix before verification
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          if 'private var nativeFallbackUsed = false' not in s:
              s = s.replace(
                  '    private var googleFallbackUsed = false',
                  '    private var googleFallbackUsed = false\n\n    private var nativeFallbackUsed = false',
                  1
              )

          start = s.index('    private fun searchMusic() {')
          end = s.index('    private fun loadGoogleFallback(', start)
          method = '''    private fun searchMusic() {

        if (destroyed) return
        val text = query.text.toString().trim()
        if (text.isBlank()) {
            Toast.makeText(this, "نام آهنگ یا خواننده را وارد کنید", Toast.LENGTH_SHORT).show()
            return
        }

        searchGeneration++
        val generation = searchGeneration
        cancelSearchCallbacks()
        googleFallbackUsed = false
        nativeFallbackUsed = false
        resultGeneration = generation
        resultPages = emptyList()
        resultPageIndex = 0
        expectedPageUrl = ""
        songs.clear()
        currentIndex = -1
        currentAudioUrl = ""
        currentSong = null
        resultsContainer.removeAllViews()
        titleText.text = text
        artistText.text = "در حال جستجو..."
        status.text = "در حال جستجوی Google..."
        seekBar.progress = 0
        currentTimeText.text = "00:00"
        durationText.text = "00:00"
        vinyl.clearCover()
        vinyl.stopRotation()
        clearLyrics()

        loadGoogleFallback(text, generation)
    }

'''
          s = s[:start] + method + s[end:]

          start = s.index('    private fun loadGoogleFallback(')
          end = s.index('    private fun cancelSearchCallbacks()', start)
          fallback = '''    private fun loadGoogleFallback(text: String, generation: Int) {
        if (destroyed || generation != searchGeneration || googleFallbackUsed) return
        googleFallbackUsed = true
        resultGeneration = generation
        resultPages = emptyList()
        resultPageIndex = 0
        val encoded = try {
            URLEncoder.encode(SearchEngine.buildGoogleQuery(text), "UTF-8")
        } catch (_: Exception) {
            startNativeFallback(text, generation)
            return
        }
        try {
            web.stopLoading()
            web.loadUrl("https://www.google.com/search?q=$encoded&num=50&hl=fa&gbv=1")
        } catch (_: Exception) {
            startNativeFallback(text, generation)
        }
    }

    private fun startNativeFallback(text: String, generation: Int) {
        if (destroyed || generation != searchGeneration || nativeFallbackUsed) return
        nativeFallbackUsed = true
        status.text = "Google نتیجه‌ای نداد؛ در حال جستجوی مستقیم منابع..."
        searchFuture?.cancel(true)
        searchFuture = ParallelSearchEngine.searchDirect(text, generation) { callbackGeneration, candidates ->
            runOnUiThread {
                if (destroyed || callbackGeneration != searchGeneration) return@runOnUiThread
                resultPages = candidates.map { it.url }
                    .filter { ServerConfig.isAllowedPageUrl(it) }
                    .distinctBy { it.substringBefore("#").trimEnd('/').lowercase() }
                    .take(60)
                resultPageIndex = 0
                if (resultPages.isEmpty()) {
                    status.text = "هیچ منبعی برای این آهنگ پیدا نشد"
                    finishSearch()
                } else {
                    status.text = "${resultPages.size} صفحه پیدا شد؛ در حال استخراج آهنگ..."
                    processNextResultPage()
                }
            }
        }
    }

'''
          s = s[:start] + fallback + s[end:]

          # If Google returns no links, immediately use native search.
          old = '''                if (resultPages.isEmpty()) {
                    finishSearch()
                } else {
                    status.text =
                        "نتایج پیدا شد؛ در حال بررسی..."
                    processNextResultPage()
                }'''
          new = '''                if (resultPages.isEmpty()) {
                    startNativeFallback(query.text.toString(), searchGeneration)
                } else {
                    status.text =
                        "نتایج پیدا شد؛ در حال بررسی..."
                    processNextResultPage()
                }'''
          if old in s:
              s = s.replace(old, new, 1)

          # If Google pages contain no playable media, use native search once.
          start_marker = '    private fun finishSearch() {'
          fs = s.index(start_marker)
          fe = s.index('    private fun saveSearchResults()', fs)
          finish = '''    private fun finishSearch() {

        if (destroyed) return

        cancelSearchCallbacks()

        if (songs.isEmpty() && googleFallbackUsed && !nativeFallbackUsed && resultGeneration == searchGeneration) {
            startNativeFallback(query.text.toString(), searchGeneration)
            return
        }

        status.text =
            if (songs.isEmpty()) {
                "آهنگ قابل پخش پیدا نشد"
            } else {
                "${songs.size} نتیجه پیدا شد"
            }

        if (songs.isNotEmpty() && currentIndex < 0) {
            currentIndex = 0
        }

        saveSearchResults()
    }

'''
          s = s[:fs] + finish + s[fe:]
          p.write_text(s, encoding='utf-8')

      - name: Persist source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Search fix already present'
          else
            git commit -m '[auto-search] Google-first search with native fallback'
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify Gradle
        run: gradle --version

      - name: Unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: music-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android lint
        run: gradle --no-daemon --stacktrace lint
