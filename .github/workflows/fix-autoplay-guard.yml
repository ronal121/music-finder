name: Fix AutoPlay Guard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply autoplay guard only
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          old = 'if (destroyed || !autoPlaySearch.not()) return'
          new = 'if (destroyed || autoPlaySearch) return'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Autoplay guard patched successfully')
          else:
              print('Autoplay guard already correct; leaving Google-first search pipeline untouched')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m '[autofix] Fix autoplay guard'
            git push
          fi
