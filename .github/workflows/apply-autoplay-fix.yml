name: Apply Auto Playlist Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-play-fix]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch autoplay logic
        shell: python
        run: |
          from pathlib import Path

          main = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = main.read_text(encoding='utf-8')

          s = s.replace(
              '    private var activeConnection: HttpURLConnection? = null\n',
              '''    private var activeConnection: HttpURLConnection? = null
    private val relatedBySongUrl = HashMap<String, List<String>>()
    private val autoPlayVisited = LinkedHashSet<String>()
    private var autoPlayHandling = false
    private var autoPlayTargetUrl = ""
    private var autoPlayTimeout: Runnable? = null
''')

          s = s.replace(
              '            val mediaUrl = intent.getStringExtra(MusicService.EXTRA_URL).orEmpty()\n            runOnUiThread {',
              '''            val mediaUrl = intent.getStringExtra(MusicService.EXTRA_URL).orEmpty()
            val ended = intent.getBooleanExtra("ended", false)
            runOnUiThread {''')

          s = s.replace(
              '                if (mediaUrl.isNotBlank()) updateActiveResultHighlight(mediaUrl)\n',
              '''                if (mediaUrl.isNotBlank()) updateActiveResultHighlight(mediaUrl)
                if (ended && !autoPlayHandling) {
                    autoPlayHandling = true
                    autoPlayNextFromSameSite()
                }
''')

          old = '''                val parts = raw.orEmpty().split("###", limit = 4)
                if (parts.size < 4) { finishCurrentResultPage(); return@runOnUiThread }
                val title = cleanTitle(decode(parts[0])).ifBlank { "Music" }
                val artist = decode(parts[1]).trim().ifBlank { "Unknown Artist" }
                val cover = decode(parts[2]).trim()
                val audio = decode(parts[3]).split("|||").map { it.trim() }
                    .firstOrNull { it.startsWith("http", true) }.orEmpty()
                if (audio.isNotBlank() && ServerConfig.isAllowedMediaUrl(audio)) {
                    val song = SongResult(audio, title, artist, getSiteName(expectedPageUrl), cover)
                    if (songs.none { it.url == song.url }) {
                        songs.add(song)
                        addSongView(song, songs.lastIndex)
                    }
                }
                finishCurrentResultPage()
'''
          new = '''                val parts = raw.orEmpty().split("###", limit = 5)
                if (parts.size < 4) {
                    if (autoPlayTargetUrl.isNotBlank()) failAutoPlayAndTryAnother()
                    else finishCurrentResultPage()
                    return@runOnUiThread
                }
                val title = cleanTitle(decode(parts[0])).ifBlank { "Music" }
                val artist = decode(parts[1]).trim().ifBlank { "Unknown Artist" }
                val cover = decode(parts[2]).trim()
                val audio = decode(parts[3]).split("|||").map { it.trim() }
                    .firstOrNull { it.startsWith("http", true) }.orEmpty()
                val relatedUrls = if (parts.size >= 5) decode(parts[4]).split("|||")
                    .map { it.trim() }
                    .filter { it.startsWith("http", true) }
                    .distinct()
                    .take(80) else emptyList()
                if (audio.isNotBlank() && ServerConfig.isAllowedMediaUrl(audio)) {
                    relatedBySongUrl[audio] = relatedUrls
                    val song = SongResult(audio, title, artist, getSiteName(expectedPageUrl), cover)
                    if (autoPlayTargetUrl.isNotBlank() && expectedPageUrl == autoPlayTargetUrl) {
                        autoPlayTargetUrl = ""
                        autoPlayTimeout?.let { handler.removeCallbacks(it) }
                        autoPlayTimeout = null
                        autoPlayHandling = false
                        playSong(song, fromAutoPlay = true)
                        return@runOnUiThread
                    }
                    if (songs.none { it.url == song.url }) {
                        songs.add(song)
                        addSongView(song, songs.lastIndex)
                    }
                } else if (autoPlayTargetUrl.isNotBlank()) {
                    failAutoPlayAndTryAnother()
                    return@runOnUiThread
                }
                finishCurrentResultPage()
'''
          if old not in s:
              raise SystemExit('MainActivity Bridge.page block not found')
          s = s.replace(old, new)

          old = '''                var els=document.querySelectorAll('audio source,audio,video source,video,a');
                for(var i=0;i<els.length;i++){var s=els[i].src||els[i].href||'';var l=s.toLowerCase();if((l.indexOf('.mp3')>=0||l.indexOf('.m4a')>=0||l.indexOf('.aac')>=0||l.indexOf('.ogg')>=0||l.indexOf('.wav')>=0||l.indexOf('.flac')>=0||l.indexOf('dl.')>=0)&&aud.indexOf(s)<0)aud.push(s);}
                MusicFinder.page(encodeURIComponent(title)+'###'+encodeURIComponent(artist)+'###'+encodeURIComponent(cover)+'###'+encodeURIComponent(aud.join('|||')));
'''
          new = '''                var els=document.querySelectorAll('audio source,audio,video source,video,a');
                for(var i=0;i<els.length;i++){var s=els[i].src||els[i].href||'';var l=s.toLowerCase();if((l.indexOf('.mp3')>=0||l.indexOf('.m4a')>=0||l.indexOf('.aac')>=0||l.indexOf('.ogg')>=0||l.indexOf('.wav')>=0||l.indexOf('.flac')>=0||l.indexOf('dl.')>=0)&&aud.indexOf(s)<0)aud.push(s);}
                var related=[], currentHost=location.hostname.toLowerCase().replace(/^www\\./,'');
                var links=document.querySelectorAll('a[href]');
                for(var j=0;j<links.length&&related.length<80;j++){
                  var a=links[j], href=a.href||'', text=(a.innerText||a.textContent||'').replace(/[\\r\\n\\t]+/g,' ').replace(/\\s+/g,' ').trim();
                  if(!href||href.indexOf('http')!==0||href===location.href)continue;
                  try{
                    var u=new URL(href); var h=u.hostname.toLowerCase().replace(/^www\\./,'');
                    var isSame=h===currentHost;
                    var looksLikeSong=(text.indexOf('دانلود آهنگ')>=0||text.indexOf('Download New Music')>=0||/دانلود|آهنگ|music|song/i.test(text));
                    var excluded=/(^|\\/)(tag|category|page|author|feed|comments)(\\/|$)/i.test(u.pathname)||/instagram|telegram|rubika|login/i.test(href);
                    if(isSame&&looksLikeSong&&!excluded&&related.indexOf(href)<0)related.push(href.split('#')[0]);
                  }catch(e){}
                }
                MusicFinder.page(encodeURIComponent(title)+'###'+encodeURIComponent(artist)+'###'+encodeURIComponent(cover)+'###'+encodeURIComponent(aud.join('|||'))+'###'+encodeURIComponent(related.join('|||')));
'''
          if old not in s:
              raise SystemExit('MainActivity extraction block not found')
          s = s.replace(old, new)

          s = s.replace(
              '                else if (resultGeneration == searchGeneration && ServerConfig.isAllowedPageUrl(url)) extractMusicPage(url)',
              '                else if (ServerConfig.isAllowedPageUrl(url) && (autoPlayTargetUrl.isNotBlank() || resultGeneration == searchGeneration)) extractMusicPage(url)')

          s = s.replace(
              '    private fun playSong(song: SongResult) {\n        if (song.url.isBlank()) return\n',
              '''    private fun playSong(song: SongResult, fromAutoPlay: Boolean = false) {
        if (song.url.isBlank()) return
        if (!fromAutoPlay) {
            autoPlayVisited.clear()
            autoPlayHandling = false
        }
''')

          marker = '''    private fun sendServiceAction(action: String, url: String, title: String, artist: String, cover: String) {
'''
          insert = '''    private fun autoPlayNextFromSameSite() {
        if (destroyed) return
        val current = currentSong ?: return
        val currentHost = try { URL(current.url).host.lowercase(Locale.US).removePrefix("www.") } catch (_: Exception) { "" }
        val candidates = relatedBySongUrl[current.url].orEmpty()
            .filter { it.isNotBlank() && it != expectedPageUrl }
            .filter { url ->
                try { URL(url).host.lowercase(Locale.US).removePrefix("www.") == currentHost } catch (_: Exception) { false }
            }
            .filter { !autoPlayVisited.contains(it) }
        if (candidates.isEmpty()) {
            autoPlayHandling = false
            status.text = "موزیک دیگری از ${current.site} پیدا نشد"
            return
        }
        val nextUrl = candidates.random()
        autoPlayVisited.add(nextUrl)
        autoPlayTargetUrl = nextUrl
        status.text = "در حال پخش تصادفی از ${current.site}..."
        autoPlayTimeout?.let { handler.removeCallbacks(it) }
        val target = nextUrl
        autoPlayTimeout = Runnable {
            if (!destroyed && autoPlayTargetUrl == target) failAutoPlayAndTryAnother()
        }
        handler.postDelayed(autoPlayTimeout!!, 8000L)
        try {
            web.stopLoading()
            web.loadUrl(nextUrl)
        } catch (_: Exception) {
            failAutoPlayAndTryAnother()
        }
    }

    private fun failAutoPlayAndTryAnother() {
        autoPlayTimeout?.let { handler.removeCallbacks(it) }
        autoPlayTimeout = null
        autoPlayTargetUrl = ""
        if (!destroyed) {
            handler.postDelayed({
                if (!destroyed) {
                    autoPlayHandling = true
                    autoPlayNextFromSameSite()
                }
            }, 150L)
        }
    }

'''
          if marker not in s:
              raise SystemExit('sendServiceAction marker not found')
          s = s.replace(marker, insert + marker, 1)
          main.write_text(s, encoding='utf-8')

          service = Path('app/src/main/java/com/kafshar/musicfinder/MusicService.kt')
          s = service.read_text(encoding='utf-8')
          s = s.replace(
              '            override fun onPlaybackStateChanged(playbackState: Int) = publish()\n',
              '''            override fun onPlaybackStateChanged(playbackState: Int) {
                publish()
                if (playbackState == Player.STATE_ENDED) publishEnded()
            }
''')
          marker = '''    private fun publish(error: String? = null) {
'''
          insert = '''    private fun publishEnded() {
        try {
            if (released || !::player.isInitialized) return
            val intent = Intent(UPDATE).setPackage(packageName).apply {
                putExtra("ended", true)
                putExtra("playing", false)
                putExtra("isPlaying", false)
                putExtra(EXTRA_TITLE, getCurrentTitle())
                putExtra(EXTRA_ARTIST, getCurrentArtist())
                putExtra(EXTRA_URL, player.currentMediaItem?.localConfiguration?.uri?.toString().orEmpty())
                putExtra(EXTRA_VOLUME, currentVolumePercent())
                putExtra(EXTRA_MUTED, muted)
            }
            sendBroadcast(intent)
        } catch (_: Exception) {}
    }

'''
          if marker not in s:
              raise SystemExit('MusicService publish marker not found')
          s = s.replace(marker, insert + marker, 1)
          service.write_text(s, encoding='utf-8')

          print('Auto-play same-site patch applied successfully')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt app/src/main/java/com/kafshar/musicfinder/MusicService.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix same-site random autoplay [auto-play-fix]"
          git push
