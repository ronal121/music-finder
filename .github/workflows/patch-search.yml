name: Patch Search Engine

on:
  push:
    branches: [ "feature/musicfinder-overhaul" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch MainActivity search
        run: python scripts/patch_search.py

      - name: Commit patched search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Connect MainActivity to 9-site SearchEngine [skip ci]"
          git push origin HEAD:feature/musicfinder-overhaul
