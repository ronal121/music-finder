name: One-time lint repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: remove duplicate onStart'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair MainActivity
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          marker = '   override fun onStart() {'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('first onStart block not found')
          second = s.find('\n        super.onStart()', start)
          if second < 0:
              raise SystemExit('duplicate onStart body not found')
          end = s.find('\n    override fun onStop()', second)
          if end < 0:
              raise SystemExit('onStop marker not found')
          replacement = '''    override fun onStart() {
        super.onStart()

        if (receiverRegistered) return

        val filter = IntentFilter(MusicService.UPDATE)

        try {
            ContextCompat.registerReceiver(
                this,
                playerReceiver,
                filter,
                ContextCompat.RECEIVER_NOT_EXPORTED
            )
            receiverRegistered = true
        } catch (_: Exception) {
            receiverRegistered = false
        }
    }
'''
          s = s[:start] + replacement + s[end+1:]
          p.write_text(s, encoding='utf-8')

      - name: Verify no legacy registration remains
        run: |
          ! grep -nE '^\s*registerReceiver\(' app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          grep -n 'ContextCompat.registerReceiver' app/src/main/java/com/kafshar/musicfinder/MainActivity.kt

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          rm -f .github/workflows/fix-lint.yml
          git add .github/workflows/fix-lint.yml
          git commit -m 'fix: remove duplicate onStart'
          git push