name: Finalize lyrics UI
on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lyrics request and scrolling
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if (key == lyricsRequestKey && lyricsText.visibility == View.VISIBLE) return', 'if (key == lyricsRequestKey) return')
          if 'import android.text.method.ScrollingMovementMethod' not in s:
              s=s.replace('import android.os.Looper\n', 'import android.os.Looper\nimport android.text.method.ScrollingMovementMethod\n')
          if 'lyricsText.movementMethod = ScrollingMovementMethod()' not in s:
              s=s.replace('        lyricsText =\n            findViewById(R.id.lyricsText)\n', '        lyricsText =\n            findViewById(R.id.lyricsText)\n        lyricsText.movementMethod = ScrollingMovementMethod()\n')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git diff --cached --quiet || (git commit -m 'Polish lyrics display' && git push)
      - name: Remove workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-lyrics-scroll.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary lyrics workflow'
          git push || true
