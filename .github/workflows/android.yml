name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Migrate search to Google-only discovery
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/java/com/kafshar/musicfinder/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          old = '''        searchFuture = ParallelSearchEngine.searchDirect(text, generation) { callbackGeneration, candidates ->
            runOnUiThread {
                if (destroyed || callbackGeneration != searchGeneration) return@runOnUiThread
                resultPages = candidates.map { it.url }
                    .filter { ServerConfig.isAllowedPageUrl(it) }
                    .distinctBy { it.substringBefore("#").trimEnd('/').lowercase() }
                    .take(60)
                resultPageIndex = 0
                if (resultPages.isEmpty()) {
                    status.text = "منابع مستقیم نتیجه‌ای ندادند؛ در حال جستجوی جایگزین..."
                    loadGoogleFallback(text, generation)
                } else {
                    status.text = "${resultPages.size} صفحه پیدا شد؛ در حال استخراج آهنگ..."
                    processNextResultPage()
                }
            }
        }
'''
          new = '''        // Google is the only discovery engine. No hard-coded music-site search is used.
        loadGoogleFallback(text, generation)
'''
          if old in s:
              s = s.replace(old, new, 1)

          start = s.index('        val hosts =\n            ServerConfig.MUSIC_SITES')
          end = s.index('        val script = """', start)
          s = s[:start] + s[end:]

          js_old = '''                var hosts=[], found=[];
'''
          # The generated source may still contain the old hosts declaration.
          if js_old in s:
              s = s.replace(js_old, '                var found=[];\n', 1)

          import re
          s = re.sub(
              r'''\n                function allowed\(u\)\{.*?\n                \}\n\n                function real\(h\)\{''',
              '''\n                function real(h){''',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('                  if(!allowed(u))\n                    continue;\n\n', '', 1)

          marker = '// GOOGLE_ONLY_DISCOVERY_V2'
          if marker not in s:
              s = s.replace('class MainActivity : Activity() {', 'class MainActivity : Activity() {\n\n    ' + marker, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit search migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Search migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git commit -m "Make Google the only search discovery engine"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify Gradle
        run: gradle --version

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Run lint
        run: gradle --no-daemon --stacktrace lint

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
