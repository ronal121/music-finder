name: Android CI

on:
  push:
    branches: [ "main", "feature/musicfinder-overhaul" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          mapfile -t apks < <(find app/build/outputs -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          printf '%s\n' "${apks[@]}"
          cp "${apks[0]}" build-artifacts/MusicFinder-debug.apk
          ls -lh build-artifacts/MusicFinder-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musicfinder-debug-apk
          path: build-artifacts/MusicFinder-debug.apk
          if-no-files-found: error
          retention-days: 14
