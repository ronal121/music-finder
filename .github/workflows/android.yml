name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Google-first search migration
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ParallelSearchEngine.searchDirect' app/src/main/java/com/kafshar/musicfinder/MainActivity.kt; then
            python3 tools/migrate_search.py
          else
            echo "Google-first search migration already applied"
          fi

      - name: Normalize JavaScript regex escaping
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/kafshar/musicfinder/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          start = s.index("    private fun extractGoogleResults() {")
          end = s.index("    private fun validateAndAddAudioCandidates(", start)
          block = s[start:end]
          block = block.replace("\\\\", "\\")
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding="utf-8")

      - name: Commit generated search migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated search changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git commit -m "Rework search around Google discovery"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify Gradle
        run: gradle --version

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Run lint
        run: gradle --no-daemon --stacktrace lint

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
