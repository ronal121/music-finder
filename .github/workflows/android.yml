name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle version
        run: gradle --version

      - name: Show MainActivity failing source context
        run: |
          echo '--- MainActivity.kt lines 2525-2545 ---'
          nl -ba app/src/main/java/com/kafshar/musicfinder/MainActivity.kt | sed -n '2525,2545p'
          echo '--- MainActivity.kt lines containing suspicious unary-plus candidates ---'
          grep -nE '^\s*\+|\(\s*\+|,\s*\+' app/src/main/java/com/kafshar/musicfinder/MainActivity.kt || true

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
