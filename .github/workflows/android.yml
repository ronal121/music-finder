name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify Gradle
        run: gradle --version

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Run lint
        run: gradle --no-daemon --stacktrace lint

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest Full CI release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "music-finder-debug.apk"
          printf '%s\\n' '{' '  "commit": "'"${GITHUB_SHA}"'",' '  "versionCode": "'"${GITHUB_RUN_NUMBER}"'",' '  "versionName": "1.3.'"${GITHUB_RUN_NUMBER}"'",' '  "workflow": "Android CI",' '  "runId": "'"${GITHUB_RUN_ID}"'"' '}' > update.json
          if ! gh release view ci-latest >/dev/null 2>&1; then
            gh release create ci-latest --target "$GITHUB_SHA" --title "Full CI Latest" --notes "آخرین نسخه ساخته‌شده توسط Full CI / Android CI"
          else
            gh release edit ci-latest --target "$GITHUB_SHA" --title "Full CI Latest" --notes "آخرین نسخه ساخته‌شده توسط Full CI / Android CI"
          fi
          gh release upload ci-latest music-finder-debug.apk update.json --clobber
