name: Build KAFSHAR Leveler (Windows)

on:
  push:
    branches: [kafshar-leveler]
    paths:
      - "KAFSHAR-Leveler/**"
      - ".github/workflows/kafshar-leveler-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S KAFSHAR-Leveler -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target KAFSHARLeveler_VST3
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAFSHAR-Leveler-VST3-Windows
          path: build/KAFSHARLeveler_artefacts/Release/VST3/**
          if-no-files-found: error
