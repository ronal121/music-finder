          # Preserve search results from earlier searches so the related queue has a larger pool.
          old = '''        val limited =
            songs.take(60)

        val data =
            limited.joinToString("\\n") {'''
          new = '''        val prefs = getSharedPreferences("search_results", MODE_PRIVATE)
