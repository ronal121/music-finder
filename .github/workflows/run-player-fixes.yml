name: Run Player Fixes

on:
  push:
    branches: [ main ]

permissions:
  actions: write

jobs:
  dispatch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix hardware volume sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch player fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run apply-player-fixes.yml --ref main
