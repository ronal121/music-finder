name: Apply lyrics integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch MainActivity
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          if 'private lateinit var lyricsText: TextView' not in s:
              s = s.replace(
                  '    private lateinit var artistText: TextView\n',
                  '    private lateinit var artistText: TextView\n    private lateinit var lyricsText: TextView\n'
              )

          if 'private var lyricsRequestKey = ""' not in s:
              s = s.replace(
                  '    private var lastProgressValue = -1\n',
                  '    private var lastProgressValue = -1\n\n    private var lyricsRequestKey = ""\n    private var lyricsRequestGeneration = 0\n'
              )

          if 'lyricsText = findViewById(R.id.lyricsText)' not in s:
              s = s.replace(
                  '        artistText =\n            findViewById(R.id.artistText)\n',
                  '        artistText =\n            findViewById(R.id.artistText)\n\n        lyricsText =\n            findViewById(R.id.lyricsText)\n'
              )

          if 'loadLyricsFor(title, artist)' not in s:
              s = s.replace(
                  '                    if (artist.isNotBlank()) {\n                        artistText.text = artist\n                    }\n\n                    if (volume in 0..100) {',
                  '                    if (artist.isNotBlank()) {\n                        artistText.text = artist\n                    }\n\n                    if (title.isNotBlank() && artist.isNotBlank()) {\n                        loadLyricsFor(title, artist)\n                    }\n\n                    if (volume in 0..100) {'
              )

          if 'clearLyrics()' not in s.split('private fun searchMusic()', 1)[1].split('private fun cancelSearchCallbacks()', 1)[0]:
              s = s.replace(
                  '        vinyl.clearCover()\n        vinyl.stopRotation()\n\n        val searchQuery =',
                  '        vinyl.clearCover()\n        vinyl.stopRotation()\n        clearLyrics()\n\n        val searchQuery ='
              )

          if 'loadLyricsFor(song.title, song.artist)' not in s:
              s = s.replace(
                  '        artistText.text =\n            "${song.artist} • ${song.site}"\n\n        currentTimeText.text =',
                  '        artistText.text =\n            "${song.artist} • ${song.site}"\n\n        loadLyricsFor(song.title, song.artist)\n\n        currentTimeText.text ='
              )

          marker = '    private fun nextSong() {'
          if 'private fun loadLyricsFor(' not in s:
              methods = '''    private fun clearLyrics() {\n        lyricsRequestGeneration++\n        lyricsRequestKey = ""\n        lyricsText.text = ""\n        lyricsText.visibility = View.GONE\n    }\n\n    private fun loadLyricsFor(title: String, artist: String) {\n        val cleanTitle = title.trim()\n        val cleanArtist = artist.trim()\n        if (cleanTitle.isBlank() || cleanArtist.isBlank()) {\n            clearLyrics()\n            return\n        }\n\n        val key = "${cleanArtist.lowercase()}|${cleanTitle.lowercase()}"\n        if (key == lyricsRequestKey && lyricsText.visibility == View.VISIBLE) return\n\n        lyricsRequestKey = key\n        val generation = ++lyricsRequestGeneration\n\n        runOnUiThread {\n            if (!destroyed && generation == lyricsRequestGeneration) {\n                lyricsText.text = "در حال دریافت متن آهنگ..."\n                lyricsText.visibility = View.VISIBLE\n            }\n        }\n\n        imageExecutor.execute {\n            val result = LyricsManager.fetch(cleanArtist, cleanTitle)\n            mainHandler.post {\n                if (destroyed || generation != lyricsRequestGeneration || key != lyricsRequestKey) return@post\n\n                if (result.found && result.lyrics.isNotBlank()) {\n                    lyricsText.text = result.lyrics\n                    lyricsText.visibility = View.VISIBLE\n                } else {\n                    lyricsText.text = ""\n                    lyricsText.visibility = View.GONE\n                }\n            }\n        }\n    }\n\n'''
              s = s.replace(marker, methods + marker)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -n "lyricsText\|loadLyricsFor\|clearLyrics" app/src/main/java/com/kafshar/musicfinder/MainActivity.kt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt .github/workflows/apply-lyrics-integration.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate lyrics into player"
          git push

      - name: Remove one-off workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-lyrics-integration.yml || true
          git diff --cached --quiet || git commit -m "Remove one-off lyrics workflow"
          git push || true
