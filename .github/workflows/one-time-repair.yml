name: One-time Music Finder Repair

on:
  push:
    paths:
      - '.github/ENHANCEMENTS_TRIGGER.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          main=root/'app/src/main/java/com/kafshar/musicfinder/MainActivity.kt'
          svc=root/'app/src/main/java/com/kafshar/musicfinder/MusicService.kt'
          par=root/'app/src/main/java/com/kafshar/musicfinder/ParallelSearchEngine.kt'
          server=root/'app/src/main/java/com/kafshar/musicfinder/ServerConfig.kt'
          s=main.read_text(encoding='utf-8')
          y=svc.read_text(encoding='utf-8')
          p=par.read_text(encoding='utf-8')
          c=server.read_text(encoding='utf-8')

          if 'private var searchVariants: List<String> = emptyList()' not in s:
              s=s.replace('    private var searchGeneration = 0', '    private var searchGeneration = 0\n    private var searchVariants: List<String> = emptyList()\n    private var searchVariantIndex = 0')

          # Make Google result callbacks additive instead of destructive.
          old='''                resultPages =\n                    raw.orEmpty()\n                        .split("###")\n                        .map { it.trim() }\n                        .filter {\n                            it.substringBefore(\n                                "|||"\n                            ).startsWith(\n                                "http",\n                                true\n                            )\n                        }\n                        .distinctBy {\n                            it.substringBefore("|||")\n                        }\n                        .take(50)'''
          new='''                val incomingPages = raw.orEmpty()\n                    .split("###")\n                    .map { it.trim() }\n                    .filter { it.substringBefore("|||").startsWith("http", true) }\n\n                resultPages = (resultPages + incomingPages)\n                    .distinctBy { it.substringBefore("|||") }\n                    .take(100)'''
          if old in s: s=s.replace(old,new,1)

          # Use the real parallel site search as a fallback/second source while WebView searches Google.
          marker='''        val searchQuery =\n            ServerConfig.searchQuery(text)'''
          inject='''        val searchQuery =\n            ServerConfig.searchQuery(text)\n\n        ParallelSearchEngine.search(text, generation) { callbackGeneration, candidates ->\n            runOnUiThread {\n                if (destroyed || callbackGeneration != searchGeneration) return@runOnUiThread\n                val incoming = candidates\n                    .sortedByDescending { it.score }\n                    .map { "${it.url}|||${it.title}" }\n                resultPages = (resultPages + incoming)\n                    .distinctBy { it.substringBefore("|||") }\n                    .take(100)\n                if (resultPageIndex == 0 && resultPages.isNotEmpty()) {\n                    status.text = "منابع پیدا شد؛ در حال بررسی..."\n                    processNextResultPage()\n                }\n            }\n        }'''
          if marker in s and 'ParallelSearchEngine.search(text, generation)' not in s: s=s.replace(marker,inject,1)

          # More robust Google query: corrected spelling + phrase + only six highest priority domains.
          c=c.replace('take(12)\n            .map { it.domain }','take(6)\n            .map { it.domain }')

          # Direct search should not hammer every configured server.
          p=p.replace('ServerConfig.MUSIC_SITES.forEach { domain ->','ServerConfig.MUSIC_SITES.take(24).forEach { domain ->')

          # Media3: emit a one-shot ended event for the UI.
          if 'const val EXTRA_ENDED = "ended"' not in y:
              y=y.replace('const val EXTRA_MUTED = "muted"','const val EXTRA_MUTED = "muted"\n        const val EXTRA_ENDED = "ended"')
          y=y.replace('private fun publish(error: String? = null) {','private fun publish(error: String? = null, ended: Boolean = false) {')
          y=y.replace('                putExtra(EXTRA_MUTED, muted)','                putExtra(EXTRA_MUTED, muted)\n                putExtra(EXTRA_ENDED, ended)')
          y=y.replace('''            override fun onPlaybackStateChanged(playbackState: Int) {\n                publish()\n            }''','''            override fun onPlaybackStateChanged(playbackState: Int) {\n                publish(ended = playbackState == Player.STATE_ENDED)\n                updateNotification()\n            }''')

          main.write_text(s,encoding='utf-8')
          svc.write_text(y,encoding='utf-8')
          par.write_text(p,encoding='utf-8')
          server.write_text(c,encoding='utf-8')

      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test assembleDebug

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt app/src/main/java/com/kafshar/musicfinder/MusicService.kt app/src/main/java/com/kafshar/musicfinder/ParallelSearchEngine.kt app/src/main/java/com/kafshar/musicfinder/ServerConfig.kt
          git commit -m 'fix: harden search fallback and playback state' || exit 0
          git push
