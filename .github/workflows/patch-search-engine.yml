name: Patch Search Engine

on:
  push:
    paths:
      - '.github/workflows/patch-search-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix search pipeline
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          if 'private var nativeFallbackUsed = false' not in s:
              needle = '    private var googleFallbackUsed = false'
              s = s.replace(needle, needle + '\n\n    private var nativeFallbackUsed = false', 1)

          start = s.index('    private fun searchMusic() {')
          end = s.index('    private fun loadGoogleFallback(', start)
          method = '''    private fun searchMusic() {

        if (destroyed) return
        val text = query.text.toString().trim()
        if (text.isBlank()) {
            Toast.makeText(this, "نام آهنگ یا خواننده را وارد کنید", Toast.LENGTH_SHORT).show()
            return
        }

        searchGeneration++
        val generation = searchGeneration
        cancelSearchCallbacks()
        googleFallbackUsed = false
        nativeFallbackUsed = false
        resultGeneration = generation
        resultPages = emptyList()
        resultPageIndex = 0
        expectedPageUrl = ""
        songs.clear()
        currentIndex = -1
        currentAudioUrl = ""
        currentSong = null
        resultsContainer.removeAllViews()
        titleText.text = text
        artistText.text = "در حال جستجو..."
        status.text = "در حال جستجوی Google..."
        seekBar.progress = 0
        currentTimeText.text = "00:00"
        durationText.text = "00:00"
        vinyl.clearCover()
        vinyl.stopRotation()
        clearLyrics()

        loadGoogleFallback(text, generation)
    }

'''
          s = s[:start] + method + s[end:]

          start = s.index('    private fun loadGoogleFallback(')
          end = s.index('    private fun cancelSearchCallbacks()', start)
          fallback = '''    private fun loadGoogleFallback(text: String, generation: Int) {
        if (destroyed || generation != searchGeneration || googleFallbackUsed) return
        googleFallbackUsed = true
        resultGeneration = generation
        resultPages = emptyList()
        resultPageIndex = 0
        val encoded = try {
            URLEncoder.encode(SearchEngine.buildGoogleQuery(text), "UTF-8")
        } catch (_: Exception) {
            status.text = "خطا در آماده‌سازی جستجو"
            startNativeFallback(text, generation)
            return
        }
        try {
            web.stopLoading()
            web.loadUrl("https://www.google.com/search?q=$encoded&num=50&hl=fa&gbv=1")
        } catch (_: Exception) {
            startNativeFallback(text, generation)
        }
    }

    private fun startNativeFallback(text: String, generation: Int) {
        if (destroyed || generation != searchGeneration || nativeFallbackUsed) return
        nativeFallbackUsed = true
        status.text = "Google نتیجه‌ای نداد؛ در حال جستجوی مستقیم منابع..."
        searchFuture?.cancel(true)
        searchFuture = ParallelSearchEngine.searchDirect(text, generation) { callbackGeneration, candidates ->
            runOnUiThread {
                if (destroyed || callbackGeneration != searchGeneration) return@runOnUiThread
                resultPages = candidates.map { it.url }
                    .filter { ServerConfig.isAllowedPageUrl(it) }
                    .distinctBy { it.substringBefore("#").trimEnd('/').lowercase() }
                    .take(60)
                resultPageIndex = 0
                if (resultPages.isEmpty()) {
                    status.text = "هیچ منبعی برای این آهنگ پیدا نشد"
                    finishSearch()
                } else {
                    status.text = "${resultPages.size} صفحه پیدا شد؛ در حال استخراج آهنگ..."
                    processNextResultPage()
                }
            }
        }
    }

'''
          s = s[:start] + fallback + s[end:]

          # Google can return an empty set without throwing. Try native search then.
          old = '''                if (resultPages.isEmpty()) {
                    finishSearch()
                } else {
                    status.text =
                        "نتایج پیدا شد؛ در حال بررسی..."
                    processNextResultPage()
                }'''
          new = '''                if (resultPages.isEmpty()) {
                    startNativeFallback(query.text.toString(), searchGeneration)
                } else {
                    status.text =
                        "نتایج پیدا شد؛ در حال بررسی..."
                    processNextResultPage()
                }'''
          if old in s:
              s = s.replace(old, new, 1)

          # After Google pages are exhausted with no playable media, use native search once.
          marker = '''    private fun finishSearch() {

        if (destroyed) return

        cancelSearchCallbacks()

        if (songs.isEmpty() && !googleFallbackUsed && resultGeneration == searchGeneration) {
            status.text = "در منابع مستقیم آهنگ قابل پخش پیدا نشد؛ در حال جستجوی Google..."
            loadGoogleFallback(query.text.toString(), searchGeneration)
            return
        }
'''
          replacement = '''    private fun finishSearch() {

        if (destroyed) return

        cancelSearchCallbacks()

        if (songs.isEmpty() && googleFallbackUsed && !nativeFallbackUsed && resultGeneration == searchGeneration) {
            startNativeFallback(query.text.toString(), searchGeneration)
            return
        }
'''
          if marker in s:
              s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source and build
        run: |
          gradle --no-daemon --stacktrace test
          gradle --no-daemon --stacktrace assembleDebug
          gradle --no-daemon --stacktrace lint

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: music-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m '[auto-search] Google-first search with native fallback'
            git push
          fi
