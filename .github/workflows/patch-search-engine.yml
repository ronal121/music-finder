name: Patch Search Engine

on:
  push:
    paths:
      - '.github/workflows/patch-search-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate native-first search
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/kafshar/musicfinder/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          if 'private var searchFuture: Future<*>? = null' not in s:
              needle = '    private var downloadFuture: Future<*>? = null'
              s = s.replace(needle, needle + '\n\n    private var searchFuture: Future<*>? = null', 1)

          if 'private var googleFallbackUsed = false' not in s:
              needle = '    private var searchGeneration = 0'
              s = s.replace(needle, needle + '\n\n    private var googleFallbackUsed = false', 1)

          start = s.index('    private fun searchMusic() {')
          end = s.index('    private fun cancelSearchCallbacks() {', start)
          method = "    private fun searchMusic() {\n\n        if (destroyed) return\n\n        val text = query.text.toString().trim()\n        if (text.isBlank()) {\n            Toast.makeText(this, \"نام آهنگ یا خواننده را وارد کنید\", Toast.LENGTH_SHORT).show()\n            return\n        }\n\n        searchGeneration++\n        val generation = searchGeneration\n        cancelSearchCallbacks()\n        googleFallbackUsed = false\n\n        resultGeneration = generation\n        resultPages = emptyList()\n        resultPageIndex = 0\n        expectedPageUrl = \"\"\n        songs.clear()\n        currentIndex = -1\n        currentAudioUrl = \"\"\n        currentSong = null\n        resultsContainer.removeAllViews()\n\n        titleText.text = text\n        artistText.text = \"در حال جستجو...\"\n        status.text = \"در حال جستجوی منابع موسیقی...\"\n        seekBar.progress = 0\n        currentTimeText.text = \"00:00\"\n        durationText.text = \"00:00\"\n        vinyl.clearCover()\n        vinyl.stopRotation()\n        clearLyrics()\n\n        searchFuture = ParallelSearchEngine.searchDirect(text, generation) { callbackGeneration, candidates ->\n            runOnUiThread {\n                if (destroyed || callbackGeneration != searchGeneration) return@runOnUiThread\n\n                resultPages = candidates.map { it.url }\n                    .filter { ServerConfig.isAllowedPageUrl(it) }\n                    .distinctBy { it.substringBefore(\"#\").trimEnd('/').lowercase() }\n                    .take(60)\n                resultPageIndex = 0\n\n                if (resultPages.isEmpty()) {\n                    status.text = \"منابع مستقیم نتیجه‌ای ندادند؛ در حال جستجوی جایگزین...\"\n                    loadGoogleFallback(text, generation)\n                } else {\n                    status.text = \"${resultPages.size} صفحه پیدا شد؛ در حال استخراج آهنگ...\"\n                    processNextResultPage()\n                }\n            }\n        }\n    }\n\n    private fun loadGoogleFallback(text: String, generation: Int) {\n        if (destroyed || generation != searchGeneration || googleFallbackUsed) return\n        googleFallbackUsed = true\n        resultGeneration = generation\n        resultPages = emptyList()\n        resultPageIndex = 0\n\n        val encoded = try {\n            URLEncoder.encode(SearchEngine.buildGoogleQuery(text), \"UTF-8\")\n        } catch (_: Exception) {\n            status.text = \"خطا در آماده‌سازی جستجو\"\n            return\n        }\n\n        try {\n            web.stopLoading()\n            web.loadUrl(\"https://www.google.com/search?q=$encoded&num=50&hl=en&gbv=1\")\n        } catch (_: Exception) {\n            status.text = \"جستجوی جایگزین در دسترس نیست\"\n        }\n    }\n\n"
          s = s[:start] + method + s[end:]

          if 'searchFuture?.cancel(true)' not in s:
              for needle in [
                  '    private fun cancelSearchCallbacks() {\n\n        searchTimeoutRunnable?.let {',
                  '    private fun cancelSearchCallbacks() {\n\n        searchTimeout?.let {'
              ]:
                  if needle in s:
                      replacement = needle.replace(
                          '\n\n        searchTimeout',
                          '\n\n        try { searchFuture?.cancel(true) } catch (_: Exception) {}\n        searchFuture = null\n\n        searchTimeout'
                      )
                      s = s.replace(needle, replacement, 1)
                      break

          marker = '    private fun finishSearch() {\n\n        if (destroyed) return\n\n        cancelSearchCallbacks()\n'
          if marker in s and 'در منابع مستقیم آهنگ قابل پخش پیدا نشد' not in s:
              insert = '\n        if (songs.isEmpty() && !googleFallbackUsed && resultGeneration == searchGeneration) {\n            status.text = "در منابع مستقیم آهنگ قابل پخش پیدا نشد؛ در حال جستجوی Google..."\n            loadGoogleFallback(query.text.toString(), searchGeneration)\n            return\n        }\n'
              s = s.replace(marker, marker + insert, 1)

          p.write_text(s, encoding='utf-8')
          print('MainActivity patched')

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify
        run: |
          gradle --no-daemon --stacktrace test
          gradle --no-daemon --stacktrace assembleDebug
          gradle --no-daemon --stacktrace lint

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: music-finder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m '[auto-search] Integrate native-first search'
            git push
          fi
