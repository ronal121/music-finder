name: Apply Search Runtime Patch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply search runtime patch
        run: python3 tools/apply_search_runtime_patch.py

      - name: Commit patched MainActivity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Search runtime already patched"
          else
            git commit -m "Wire search parsers into MainActivity"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          mapfile -t apks < <(find app/build/outputs -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          cp "${apks[0]}" build-artifacts/MusicFinder-debug.apk
          ls -lh build-artifacts/MusicFinder-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musicfinder-search-runtime-apk
          path: build-artifacts/MusicFinder-debug.apk
          if-no-files-found: error
          retention-days: 14
