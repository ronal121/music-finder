name: Apply Music Finder Features

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Music Finder
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          main = root/'app/src/main/java/com/kafshar/musicfinder/MainActivity.kt'
          service = root/'app/src/main/java/com/kafshar/musicfinder/MusicService.kt'
          xml = root/'app/src/main/res/layout/activity_main.xml'

          s = main.read_text(encoding='utf-8')
          if 'private var randomSameArtistMode' not in s:
              s = s.replace('private var randomMode = false', '''private var randomMode = false
    private var randomSameArtistMode = false
    private var autoRandomEnabled = true
    private var autoRandomBusy = false''')
          s = s.replace('val mediaUrl = intent.getStringExtra(MusicService.EXTRA_URL).orEmpty()', '''val mediaUrl = intent.getStringExtra(MusicService.EXTRA_URL).orEmpty()
            val ended = intent.getBooleanExtra("ended", false)''')
          s = s.replace('if (mediaUrl.isNotBlank()) updateActiveResultHighlight(mediaUrl)', '''if (mediaUrl.isNotBlank()) updateActiveResultHighlight(mediaUrl)
                if (ended && autoRandomEnabled && !autoRandomBusy) {
                    autoRandomBusy = true
                    handler.post { playRandomAfterCurrent() }
                }''')
          marker = '        findViewById<TextView>(R.id.search).setOnClickListener { searchMusic() }'
          if marker in s and 'R.id.randomSameArtistButton' not in s:
              s = s.replace(marker, '''        findViewById<TextView>(R.id.search).setOnClickListener { searchMusic() }
        findViewById<TextView>(R.id.clearQuery).setOnClickListener { query.setText(""); query.requestFocus(); hideKeyboard() }
        findViewById<TextView>(R.id.randomSameArtistButton).setOnClickListener {
            randomSameArtistMode = true
            autoRandomEnabled = true
            updateRandomModeButtons()
        }
        findViewById<TextView>(R.id.randomAnyArtistButton).setOnClickListener {
            randomSameArtistMode = false
            autoRandomEnabled = true
            updateRandomModeButtons()
        }''')
          if 'private fun updateRandomModeButtons()' not in s:
              anchor = '    private fun setupVolumeControl() {'
              fn = '''    private fun updateRandomModeButtons() {
        val same = findViewById<TextView>(R.id.randomSameArtistButton)
        val any = findViewById<TextView>(R.id.randomAnyArtistButton)
        same.text = if (randomSameArtistMode) "● 🎤 همین خواننده" else "○ 🎤 همین خواننده"
        any.text = if (!randomSameArtistMode) "● 🎵 همه خواننده‌ها" else "○ 🎵 همه خواننده‌ها"
    }

    private fun playRandomAfterCurrent() {
        if (destroyed) return
        val current = currentSong ?: run { autoRandomBusy = false; return }
        val host = try { Uri.parse(currentSongPageUrl).host.orEmpty().removePrefix("www.") } catch (_: Exception) { "" }
        if (host.isBlank()) { autoRandomBusy = false; return }
        val q = if (randomSameArtistMode && current.artist.isNotBlank() && current.artist != "Unknown Artist") {
            "${current.artist} site:$host"
        } else {
            "music site:$host"
        }
        val encoded = try { URLEncoder.encode(q, "UTF-8") } catch (_: Exception) { autoRandomBusy = false; return }
        searchGeneration++
        cancelSearchCallbacks()
        resultGeneration = searchGeneration
        resultPages = emptyList()
        resultPageIndex = 0
        expectedPageUrl = ""
        val oldUrl = currentAudioUrl
        songs.clear(); songPageUrls.clear(); currentIndex = -1; currentAudioUrl = ""; currentSong = null
        resultsContainer.removeAllViews()
        status.text = if (randomSameArtistMode) "در حال پیدا کردن آهنگ تصادفی از ${current.artist}..." else "در حال پیدا کردن آهنگ تصادفی از همین سایت..."
        try { web.stopLoading(); web.loadUrl("https://www.google.com/search?q=$encoded&num=50&hl=en&gbv=1") }
        catch (_: Exception) { autoRandomBusy = false; return }
        val generation = searchGeneration
        val timeout = Runnable { if (!destroyed && generation == searchGeneration && resultPages.isEmpty()) { autoRandomBusy = false; status.text = "آهنگ بعدی پیدا نشد" } }
        searchTimeout = timeout
        handler.postDelayed(timeout, 12000L)
    }

'''
              s = s.replace(anchor, fn + anchor)
          s = s.replace('resultPages = raw.orEmpty().split("###")', 'resultPages = raw.orEmpty().split("###")')
          s = s.replace('''resultPages = raw.orEmpty().split("###")
                    .map { it.trim() }''', '''resultPages = raw.orEmpty().split("###")
                    .map { it.trim() }
                    .shuffled()''')
          s = s.replace('''if (audio.isNotBlank() && ServerConfig.isAllowedMediaUrl(audio)) {''', '''if (audio.isNotBlank() && ServerConfig.isAllowedMediaUrl(audio)) {''')
          s = s.replace('''songPageUrls[song.url] = expectedPageUrl
                        addSongView(song, songs.lastIndex)''', '''songPageUrls[song.url] = expectedPageUrl
                        if (songs.size == 1) {
                            currentSongPageUrl = expectedPageUrl
                            lyricsText.text = "📄  مشاهده متن و صفحه آهنگ در سایت  ›"
                            lyricsText.visibility = View.VISIBLE
                        }
                        addSongView(song, songs.lastIndex)''')
          s = s.replace('''        query = findViewById(R.id.query)''', '''        query = findViewById(R.id.query)''')
          # Hide keyboard for player actions without changing search logic.
          for old,new in [
              ('playButton.setOnClickListener {', 'playButton.setOnClickListener { hideKeyboard()'),
              ('previousButton.setOnClickListener { previousSong() }', 'previousButton.setOnClickListener { hideKeyboard(); previousSong() }'),
              ('nextButton.setOnClickListener { nextSong() }', 'nextButton.setOnClickListener { hideKeyboard(); nextSong() }'),
              ('downloadButton.setOnClickListener { downloadCurrentSong() }', 'downloadButton.setOnClickListener { hideKeyboard(); downloadCurrentSong() }'),
              ('saveButton.setOnClickListener { saveCurrentSong() }', 'saveButton.setOnClickListener { hideKeyboard(); saveCurrentSong() }'),
              ('libraryButton.setOnClickListener { startActivity(Intent(this, LibraryActivity::class.java)) }', 'libraryButton.setOnClickListener { hideKeyboard(); startActivity(Intent(this, LibraryActivity::class.java)) }')]:
              s=s.replace(old,new)
          main.write_text(s, encoding='utf-8')

          m = service.read_text(encoding='utf-8')
          if 'lastPublishedEnded' not in m:
              m = m.replace('private var foregroundStarted = false', 'private var foregroundStarted = false\n    private var lastPublishedEnded = false')
          m = m.replace('''override fun onPlaybackStateChanged(playbackState: Int) = publish()''', '''override fun onPlaybackStateChanged(playbackState: Int) {
                    val ended = playbackState == Player.STATE_ENDED
                    if (ended && !lastPublishedEnded) publish(ended = true)
                    lastPublishedEnded = ended
                    publish()
                }''')
          m = m.replace('''private fun publish(error: String? = null) {''', '''private fun publish(error: String? = null, ended: Boolean = false) {''')
          m = m.replace('''putExtra(EXTRA_URL, player.currentMediaItem?.localConfiguration?.uri?.toString().orEmpty())''', '''putExtra(EXTRA_URL, player.currentMediaItem?.localConfiguration?.uri?.toString().orEmpty())
                putExtra("ended", ended)''')
          m = m.replace('''player.prepare()
        player.play()''', '''player.prepare()
        lastPublishedEnded = false
        player.play()''')
          service.write_text(m, encoding='utf-8')

          x = xml.read_text(encoding='utf-8')
          if 'android:id="@+id/clearQuery"' not in x:
              x = x.replace('''<com.kafshar.musicfinder.HarmonizedButton android:id="@+id/search"''', '''<TextView android:id="@+id/clearQuery" android:layout_width="34dp" android:layout_height="48dp" android:gravity="center" android:text="×" android:textColor="@color/muted" android:textSize="22sp" android:clickable="true" android:focusable="true" android:contentDescription="Clear search"/>
                <com.kafshar.musicfinder.HarmonizedButton android:id="@+id/search"''')
          if 'android:id="@+id/randomSameArtistButton"' not in x:
              x = x.replace('''<LinearLayout android:id="@+id/resultsSection"''', '''<LinearLayout android:layout_width="match_parent" android:layout_height="44dp" android:layout_marginTop="10dp" android:gravity="center" android:orientation="horizontal">
                <TextView android:id="@+id/randomSameArtistButton" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1" android:gravity="center" android:text="● 🎤 همین خواننده" android:textColor="@color/accent" android:textSize="12sp" android:clickable="true" android:focusable="true"/>
                <TextView android:id="@+id/randomAnyArtistButton" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1" android:gravity="center" android:text="○ 🎵 همه خواننده‌ها" android:textColor="@color/muted" android:textSize="12sp" android:clickable="true" android:focusable="true"/>
            </LinearLayout>
            <LinearLayout android:id="@+id/resultsSection"''')
          xml.write_text(x, encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'randomSameArtistMode' app/src/main/java/com/kafshar/musicfinder/MainActivity.kt
          grep -q 'ACTION_SET_VOLUME' app/src/main/java/com/kafshar/musicfinder/MusicService.kt
          grep -q 'clearQuery' app/src/main/res/layout/activity_main.xml
          grep -q 'randomAnyArtistButton' app/src/main/res/layout/activity_main.xml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kafshar/musicfinder/MainActivity.kt app/src/main/java/com/kafshar/musicfinder/MusicService.kt app/src/main/res/layout/activity_main.xml
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add random artist modes and search keyboard UX"; git push; fi
